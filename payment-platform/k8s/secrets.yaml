apiVersion: v1
kind: Secret
metadata:
  name: pearlpay-secrets
  labels:
    app: pearlpay
  annotations:
    security-note: "These secrets must be replaced by External Secrets Operator pulling from HashiCorp Vault in production. See phase-6-secrets."
type: Opaque
# // FIXED: Kubernetes Security - static secret values were removed; production values must be injected by External Secrets Operator from HashiCorp Vault and encrypted at rest.
# Secret data is intentionally empty here because Vault-backed External Secrets will inject the runtime values.
data: {}
