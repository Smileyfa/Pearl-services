apiVersion: apps/v1
kind: Deployment
metadata:
  name: pearlpay-api
  labels:
    app: pearlpay-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pearlpay-api
  template:
    metadata:
      labels:
        app: pearlpay-api
    spec:
      # // FIXED: Kubernetes Security - API pods use a dedicated service account instead of the default service account.
      serviceAccountName: pearlpay-api-sa
      # // FIXED: Kubernetes Security - API pods run as a non-root user and group.
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: api
          image: 387390481270.dkr.ecr.eu-west-2.amazonaws.com/pearlpay/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: pearlpay-secrets
          env:
            - name: APP_ENV
              value: production
          # // FIXED: Kubernetes Security - API container runs without privilege escalation, root filesystem writes, or Linux capabilities.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          # // FIXED: Kubernetes Security - API container has CPU and memory requests and limits defined.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pearlpay-frontend
  labels:
    app: pearlpay-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pearlpay-frontend
  template:
    metadata:
      labels:
        app: pearlpay-frontend
    spec:
      # // FIXED: Kubernetes Security - frontend pods use a dedicated service account instead of the default service account.
      serviceAccountName: pearlpay-frontend-sa
      # // FIXED: Kubernetes Security - frontend pods run as a non-root user and group.
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
        fsGroup: 1000
      containers:
        - name: frontend
          image: 387390481270.dkr.ecr.eu-west-2.amazonaws.com/pearlpay/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
          env:
            - name: VITE_API_BASE
              value: https://api.pearlpay.example
          # // FIXED: Kubernetes Security - frontend container runs without privilege escalation, root filesystem writes, or Linux capabilities.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          # // FIXED: Kubernetes Security - frontend container has CPU and memory requests and limits defined.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
