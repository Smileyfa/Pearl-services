apiVersion: v1
kind: Service
metadata:
  name: pearlpay-api
  labels:
    app: pearlpay-api
spec:
  selector:
    app: pearlpay-api
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: pearlpay-frontend
  labels:
    app: pearlpay-frontend
spec:
  selector:
    app: pearlpay-frontend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 5173
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: pearlpay-admin-dashboard
  labels:
    app: pearlpay-api
spec:
  selector:
    app: pearlpay-api
  ports:
    - name: admin-api
      protocol: TCP
      port: 80
      targetPort: 8000
  # // VULN: Kubernetes Security - admin dashboard API is exposed through LoadBalancer without a NetworkPolicy.
  type: LoadBalancer
